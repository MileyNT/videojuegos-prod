<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi App Flask{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Inicio</a> |
        <a href="{{ url_for('contact') }}">Contacto</a> |
        {% if current_user.is_authenticated %}
            <form method="post" action="{{ url_for('auth.logout') }}" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Cerrar sesión</button>
            </form>
        {% else %}
            <a href="{{ url_for('auth.login') }}">Ingresar</a>
        {% endif %}
    </nav>
    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                    {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 Mi Universidad</p>
    </footer>
</body>
</html>
